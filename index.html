<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Absensi Digital</title>
  
  <!-- Library jsQR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* TEMA CERAH NUANSA BIRU */
      --primary: #2563eb;           /* Biru Utama */
      --primary-hover: #1d4ed8;     /* Biru Gelap Hover */
      --primary-glow: rgba(37, 99, 235, 0.25);
      --bg: #ebf3fe;                /* Background Halaman Biru Muda Segar */
      --card-bg: #ffffff;           /* Kartu Putih Bersih */
      --border: #dbeafe;            /* Border Biru Soft */
      --text-main: #0f172a;         /* Teks Utama Gelap / Kontras */
      --text-muted: #64748b;        /* Teks Sekunder Slate */
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    
    .app-card { width: 100%; max-width: 650px; background: var(--card-bg); border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.12); overflow: hidden; }
    
    /* STYLES HEADER & LOGO */
    .header { padding: 28px 24px 20px; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%); }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .header-title-box { flex: 1; text-align: center; }
    
    .school-logo { width: 60px; height: 60px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08)); }
    
    .badge { display: inline-flex; align-items: center; padding: 6px 14px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .header h1 { font-size: 1.5rem; font-weight: 800; color: var(--text-main); }
    .header p { font-size: 0.95rem; color: var(--text-muted); margin-top: 4px; }
    
    .scanner-container { padding: 24px; display: flex; flex-direction: column; align-items: center; }
    .video-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; background: #0f172a; border-radius: 24px; overflow: hidden; border: 3px solid #bfdbfe; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.2); }
    #webcam { width: 100%; height: 100%; object-fit: cover; }
    .laser-line { display: none; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, transparent, #3b82f6, transparent); box-shadow: 0 0 20px #3b82f6; animation: scan 2s infinite ease-in-out; z-index: 5; }
    @keyframes scan { 0% { top: 5%; } 50% { top: 90%; } 100% { top: 5%; } }
    
    .start-overlay { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px; text-align: center; z-index: 10; }
    .start-overlay-icon { font-size: 3.2rem; margin-bottom: 16px; }
    .start-overlay p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 22px; line-height: 1.5; }
    
    .btn-primary { background: var(--primary); color: #fff; border: none; padding: 16px 36px; border-radius: 16px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 8px 24px var(--primary-glow); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
    .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid #cbd5e1; padding: 12px 22px; border-radius: 14px; font-weight: 600; font-size: 0.9rem; cursor: pointer; margin-top: 18px; transition: all 0.2s; }
    .btn-secondary:hover { background: #e2e8f0; }
    
    .status-section { padding: 0 24px 28px; }
    .status-card { padding: 20px; border-radius: 20px; background: #f8fafc; border: 1px solid var(--border); text-align: center; transition: all 0.3s ease; }
    .status-title { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; color: var(--text-muted); }
    .status-desc { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    
    .status-card.idle { border-color: #cbd5e1; }
    .status-card.loading { background: #fffbeb; border-color: #fde68a; }
    .status-card.loading .status-title { color: #d97706; }
    .status-card.loading .status-desc { color: #b45309; }
    
    .status-card.success { background: #ecfdf5; border-color: #a7f3d0; }
    .status-card.success .status-title { color: #059669; }
    .status-card.success .status-desc { color: #047857; }
    
    .status-card.error { background: #fef2f2; border-color: #fecaca; }
    .status-card.error .status-title { color: #dc2626; }
    .status-card.error .status-desc { color: #b91c1c; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <div class="header-top">
      <!-- GANTI FILE_ID_1 DENGAN ID GOOGLE DRIVE LOGO KIRI -->
      <img src="https://lh3.googleusercontent.com/d/FILE_ID_1" alt="Logo Kiri" class="school-logo" onerror="this.src='https://via.placeholder.com/60?text=Logo+1'">
      
      <div class="header-title-box">
        <div class="badge">● Live Scanner</div>
        <h1>Absensi QR Code</h1>
      </div>
      
      <!-- GANTI FILE_ID_2 DENGAN ID GOOGLE DRIVE LOGO KANAN -->
      <img src="https://lh3.googleusercontent.com/d/FILE_ID_2" alt="Logo Kanan" class="school-logo" onerror="this.src='https://via.placeholder.com/60?text=Logo+2'">
    </div>
    <p>Arahkan Kartu ID Siswa ke kamera</p>
  </div>

  <div class="scanner-container">
    <div class="video-wrapper">
      <div id="laser" class="laser-line"></div>
      <video id="webcam" autoplay playsinline muted></video>
      
      <div id="startOverlay" class="start-overlay">
        <div class="start-overlay-icon">📷</div>
        <p>Klik tombol untuk menghubungkan kamera perangkat Anda.</p>
        <button class="btn-primary" onclick="startCamera()">Buka Kamera</button>
      </div>
    </div>

    <button id="btnSwitch" class="btn-secondary" style="display: none;" onclick="switchCamera()">
      🔄 Ganti Kamera
    </button>
  </div>

  <div class="status-section">
    <div id="statusCard" class="status-card idle">
      <div id="statusTitle" class="status-title">Status Scanner</div>
      <div id="statusDesc" class="status-desc">Siap Mengaktifkan Kamera</div>
    </div>
  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbytVYQ86ZzQM0ulD3PweU2LRw8-CvX3Tb-WPqzEJkFeijsnXta3OgsjvPAsOiAlc-DnKw/exec";

  const video = document.getElementById('webcam');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  
  let currentStream = null;
  let facingMode = "environment";
  let isScanning = false;
  let isProcessing = false;
  let lastScannedCode = "";

  function setStatus(title, desc, type) {
    const card = document.getElementById('statusCard');
    document.getElementById('statusTitle').innerText = title;
    document.getElementById('statusDesc').innerText = desc;
    card.className = 'status-card ' + type;
  }

  async function startCamera() {
    setStatus('MEMUAT', 'Mengakses kamera...', 'loading');
    
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }

    try {
      const constraints = { video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } } };
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
      await video.play();

      document.getElementById('startOverlay').style.display = 'none';
      document.getElementById('laser').style.display = 'block';
      document.getElementById('btnSwitch').style.display = 'inline-block';
      
      isScanning = true;
      setStatus('READY', 'Arahkan QR Code ke kamera', 'idle');
      requestAnimationFrame(tick);
    } catch (err) {
      console.error(err);
      if (facingMode === "environment") {
        facingMode = "user";
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = currentStream;
          await video.play();

          document.getElementById('startOverlay').style.display = 'none';
          document.getElementById('laser').style.display = 'block';
          isScanning = true;
          setStatus('READY', 'Arahkan QR Code ke kamera', 'idle');
          requestAnimationFrame(tick);
          return;
        } catch (e2) {
          handleCameraError(e2);
          return;
        }
      }
      handleCameraError(err);
    }
  }

  function handleCameraError(err) {
    document.getElementById('startOverlay').style.display = 'flex';
    document.getElementById('laser').style.display = 'none';
    setStatus('ERROR KAMERA', 'Gagal membuka kamera: ' + err.message, 'error');
  }

  function switchCamera() {
    facingMode = facingMode === "environment" ? "user" : "environment";
    startCamera();
  }

  function tick() {
    if (!isScanning) return;

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.height = video.videoHeight;
      canvas.width = video.videoWidth;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

      if (code && code.data) {
        onQrDetected(code.data);
        return;
      }
    }
    if (isScanning) requestAnimationFrame(tick);
  }

  function onQrDetected(qrData) {
    if (isProcessing) return;

    isProcessing = true;
    isScanning = false;
    lastScannedCode = qrData;

    setStatus('MEMPROSES', `QR Terdeteksi: ${qrData}...`, 'loading');

    window.handleAbsensiResponse = function(response) {
      if (response.success) {
        setStatus('BERHASIL', response.message, 'success');
      } else {
        setStatus('DITOLAK', response.message, 'error');
      }
      cleanupScript();
      resetScanState();
    };

    const scriptId = 'jsonp-absensi-script';
    let scriptTag = document.getElementById(scriptId);
    if (scriptTag) scriptTag.remove();

    scriptTag = document.createElement('script');
    scriptTag.id = scriptId;
    const timestamp = new Date().getTime();
    scriptTag.src = `${GAS_WEB_APP_URL}?idSiswa=${encodeURIComponent(qrData)}&callback=handleAbsensiResponse&_=${timestamp}`;
    
    scriptTag.onerror = function() {
      setStatus('SERVER ERROR', 'Gagal terhubung ke Google Apps Script.', 'error');
      cleanupScript();
      resetScanState();
    };

    function cleanupScript() {
      const tag = document.getElementById(scriptId);
      if (tag) tag.remove();
      delete window.handleAbsensiResponse;
    }

    function resetScanState() {
      setTimeout(() => {
        isProcessing = false;
        lastScannedCode = "";
        setStatus('READY', 'Arahkan QR Code ke kamera', 'idle');
        isScanning = true;
        requestAnimationFrame(tick);
      }, 3500);
    }

    document.body.appendChild(scriptTag);
  }
</script>
</body>
</html>
